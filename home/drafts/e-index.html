<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://beeswax.getflourish.org; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<title>Projects — draft E (index)</title>
<style>
@font-face { font-family: "IBM Plex Mono"; src: url(fonts/plex-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(fonts/plex-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
:root { --bg: #1d1e20; --line: #36383c; --dim: #8f939b; --text: #f0eee9; --accent: #8fd3a6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "IBM Plex Mono", ui-monospace, monospace; padding: 56px 24px 80px; }
main { max-width: 1040px; margin: 0 auto; }
section { display: grid; grid-template-columns: 200px 1fr; gap: 0 40px; padding: 28px 0; border-top: 1px solid var(--line); }
section:first-child { border-top: 0; padding-top: 0; }
h1, h2 { font-size: 15px; font-weight: 600; margin: 0; color: var(--dim); }
h1 { color: var(--text); }
@media (max-width: 720px) { section { grid-template-columns: 1fr; gap: 16px; } }
a { color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.cards { display: grid; gap: 24px; }
.card { position: relative; }
.shot { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #dfedfc; border: 1px solid var(--line); }
.shot iframe { position: absolute; top: 0; left: 0; width: 200%; height: 200%; border: 0; transform: scale(.5); transform-origin: 0 0; pointer-events: none; }
.card:hover .shot { border-color: var(--accent); }
.name { font-size: 22px; font-weight: 600; text-decoration: none; display: inline-block; margin-top: 12px; }
.name::after { content: ""; position: absolute; inset: 0; }
.card:hover .name { color: var(--accent); }
.card p { margin: 2px 0 0; color: var(--dim); }
.card.small .name { font-size: 17px; margin-top: 0; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 24px; padding: 0 0 10px; }
li .n { color: var(--accent); font-variant-numeric: tabular-nums; }
.contact a { display: inline-block; padding: 8px 0; margin-right: 32px; text-decoration-color: var(--accent); text-underline-offset: 4px; }
.contact a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <section>
    <h1>Projects</h1>
    <div class="cards">
      <div class="card">
        <div class="shot"><iframe src="https://beeswax.getflourish.org/" title="Beeswax page preview" loading="lazy" tabindex="-1" aria-hidden="true" scrolling="no"></iframe></div>
        <a class="name" href="https://beeswax.getflourish.org/">Beeswax</a><p>An effective dumbphone solution on Android.</p>
      </div>
      <div class="card small">
        <a class="name" href="https://github.com/flourish-today/ObsidianCode">ObsidianCode</a><p>A fork of T3 Code's Android app with improved privacy and usability.</p>
      </div>
    </div>
  </section>
  <section>
    <h2>In progress</h2>
    <ul>
      <li><span>Meditation app</span><span class="n">70%</span></li>
      <li><span>Things 3 with E2EE and Android</span><span class="n">50%</span></li>
    </ul>
  </section>
  <section class="contact">
    <h2>Contact</h2>
    <div>
      <a href="mailto:flourish.today@protonmail.com">flourish.today@protonmail.com</a><a href="https://smp17.simplex.im/a#OYNzLgLMY-vsrI69LroxLrhc4xkyLGpT2Q5ygNvoaAc">SimpleX</a>
    </div>
  </section>
</main>
</body>
</html>
