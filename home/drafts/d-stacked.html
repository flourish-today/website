<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://beeswax.getflourish.org; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<title>Projects — draft D (stacked)</title>
<style>
@font-face { font-family: "JetBrains Mono"; src: url(fonts/jetbrains.woff2) format("woff2"); font-weight: 400 800; font-display: swap; }
:root { --bg: #202124; --card: #28292d; --line: #3a3c41; --dim: #9a9ea6; --text: #eeece8; --accent: #eeece8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "JetBrains Mono", ui-monospace, monospace; padding: 64px 20px 80px; }
main { max-width: 820px; margin: 0 auto; }
h1 { font-size: clamp(32px, 7vw, 48px); font-weight: 800; letter-spacing: -.03em; line-height: 1; margin: 0 0 40px; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 64px 0 16px; }
a { color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.card { position: relative; display: block; border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; margin: 0 0 16px; text-decoration: none; }
.card:hover { border-color: #6b6e75; }
.shot { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #dfedfc; border-bottom: 1px solid var(--line); }
.shot iframe { position: absolute; top: 0; left: 0; width: 200%; height: 200%; border: 0; transform: scale(.5); transform-origin: 0 0; pointer-events: none; }
.txt { padding: 16px 20px 18px; }
.name { font-size: 20px; font-weight: 800; text-decoration: none; }
.card .name::after { content: ""; position: absolute; inset: 0; }
.txt p { margin: 4px 0 0; color: var(--dim); }
.card.small .name { font-size: 16px; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; padding: 14px 0; border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }
.pct { color: var(--dim); }
.contact { display: flex; flex-wrap: wrap; gap: 4px 32px; }
.contact a { display: inline-block; padding: 10px 0; text-underline-offset: 4px; }
.contact a:hover { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Projects</h1>

  <div class="card">
    <div class="shot"><iframe src="https://beeswax.getflourish.org/" title="Beeswax page preview" loading="lazy" tabindex="-1" aria-hidden="true" scrolling="no"></iframe></div>
    <div class="txt"><a class="name" href="https://beeswax.getflourish.org/">Beeswax</a><p>An effective dumbphone solution on Android.</p></div>
  </div>
  <div class="card small">
    <div class="txt"><a class="name" href="https://github.com/flourish-today/ObsidianCode">ObsidianCode</a><p>A fork of T3 Code's Android app with improved privacy and usability.</p></div>
  </div>

  <h2>In progress</h2>
  <div class="row"><span>Meditation app</span><span class="pct">70%</span></div>
  <div class="row"><span>Things 3 with E2EE and Android</span><span class="pct">50%</span></div>

  <h2>Contact</h2>
  <div class="contact">
    <a href="mailto:flourish.today@protonmail.com">flourish.today@protonmail.com</a>
    <a href="https://smp17.simplex.im/a#OYNzLgLMY-vsrI69LroxLrhc4xkyLGpT2Q5ygNvoaAc">SimpleX</a>
  </div>
</main>
</body>
</html>
